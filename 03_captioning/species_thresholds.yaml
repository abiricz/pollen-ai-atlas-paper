# ============================================
# NOTES FOR THRESHOLD CALIBRATION
# ============================================
#
# When to INCREASE threshold (e.g., 0.5 → 0.7):
#   - Many false positives (debris, bubbles, overlapping grains)
#   - Confusion with morphologically similar species
#   - High-value dataset where precision matters more than recall
#
# When to DECREASE threshold (e.g., 0.5 → 0.3):
#   - Missing valid pollen grains (low recall)
#   - Species has distinctive features
#   - Training data may not fully represent species variation
#
# Validation procedure:
#   1. Run with current threshold
#   2. Check sample_crops/ output
#   3. If >10% false positives: increase threshold
#   4. If <90% recall on obvious grains: decrease threshold
#   5. Mark as validated: true once satisfied
