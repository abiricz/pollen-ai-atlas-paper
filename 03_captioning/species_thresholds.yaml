# Species Threshold Configuration
# ================================
#
# PURPOSE:
#   Filter POLLEN vs NON-POLLEN (background) from classifier predictions.
#   The classifier outputs probability for each class, but we only care about
#   whether the prediction is "any pollen class" vs "background".
#
#   Note: The classifier predicts 52 classes (51 pollen + 1 background).
#   Filtering uses: sum(pollen_probs) > threshold to keep as pollen.
#
# HITL (Human-In-The-Loop) Workflow:
#   1. Run pipeline with default thresholds
#   2. Inspect sample_crops/ output (5-10 samples)
#   3. Adjust threshold in this file
#   4. Re-run pipeline on same slide
#   5. Repeat until quality is satisfactory
#   6. Record final threshold with notes
#
# Guidelines:
#   - Higher threshold (0.7+) = More precise, fewer false positives
#   - Lower threshold (0.3-0.5) = Higher recall, may include debris
#   - Species with similar morphology need higher thresholds
#   - Distinctive species (e.g., Pinus saccate) can use lower thresholds

# Default thresholds applied when species not listed
defaults:
  classifier_threshold: 0.5    # Pollen probability threshold (pollen vs background)
  nms_iou: 0.10               # Remove overlapping detections
  conf_thr: 0.0               # Keep all after attention reranking


