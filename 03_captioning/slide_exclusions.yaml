# =============================================================================
# SLIDE EXCLUSION LIST FOR PRODUCTION CAPTIONING
# =============================================================================
#
# This file controls which slides are EXCLUDED from production captioning.
# Edit this file manually to add/remove slides based on quality review.
#
# REASONS FOR EXCLUSION:
#   - missing_anchor: No anchor/species/family files created yet
#   - bad_quality: Poor image quality or annotation issues
#   - bad_label: Incorrect species/family label at data creation
#   - uncertain_taxonomy: Cannot confirm species/family identification
#   - too_few_grains: Insufficient grains after filtering (< threshold)
#   - family_only: Only family-level identification available (no species)
#   - other: See notes field for explanation
#
# HOW TO USE:
#   1. Add slide name under the appropriate dataset
#   2. Specify reason from the list above
#   3. Add optional notes for context
#   4. The production scripts will skip these slides automatically
#
# WORKFLOW:
#   1. Mining (02_mining/) → all slides processed
#   2. Filtering (03_captioning/filter_candidates.py) → all slides processed
#   3. Validation (03_captioning/caption_validation.py) → respects this exclusion list
#   4. Production (03_captioning/caption_production.py) → respects this exclusion list
#
# =============================================================================

# Global settings
settings:
  min_grains_threshold: 5  # Slides with fewer grains are auto-flagged
  require_anchor_files: true  # Skip slides without anchor files

